[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "decide-connector"
version = "0.1.0"
description = "Route typed decision questions (choice/score/noul) to Jev or Peewee"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
peewee = ["peewee-decide"]

[tool.setuptools]
packages = ["decide_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
